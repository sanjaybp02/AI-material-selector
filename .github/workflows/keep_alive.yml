name: Keep App Alive

on:
  schedule:
    # GitHub throttles high-frequency schedules under real-world load -
    # a */10 cron on this repo was actually landing roughly hourly in
    # practice (confirmed via run history), so */30 here is an honest
    # target rather than a number GitHub won't deliver on anyway.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # A curl-based version of this workflow used to run here and
      # always report "success" - it really did reach a genuine 200 on
      # the app's static HTML shell, but a bare HTTP client never
      # executes JavaScript, so it never fired the actual
      # POST /api/v1/app/event/open call Streamlit Community Cloud
      # uses to register a real visit and reset its sleep timer. The
      # app kept going to sleep the whole time regardless of that
      # "success." See .github/scripts/wake_streamlit_app.py for the
      # full story and verification.
      - name: Visit the app like a real browser
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: python .github/scripts/wake_streamlit_app.py

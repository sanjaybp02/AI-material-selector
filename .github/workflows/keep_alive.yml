name: Keep App Alive

on:
  schedule:
    # Run every 15 minutes to prevent Streamlit Cloud sleeping
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # Replace APP_URL with your deployed Streamlit Cloud URL (e.g. https://your-app.streamlit.app)
          APP_URL="${{ secrets.APP_URL }}"
          if [ -n "$APP_URL" ]; then
            echo "Pinging $APP_URL..."
            curl -s -f -L "$APP_URL" > /dev/null && echo "Ping successful!" || echo "Ping failed!"
          else
            echo "No APP_URL secret configured. Please set APP_URL in GitHub Repository Secrets."
          fi
